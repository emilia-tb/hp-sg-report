<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HP SG Report — August 2026</title>
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --panel: rgba(20, 22, 28, 0.85);
      --btn: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
      padding: 1.5rem 4.5rem 0.75rem;
    }

    .slide-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      background: #111;
      display: block;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 72px;
      border: none;
      border-radius: 10px;
      background: var(--btn);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, opacity 0.15s ease;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .nav-btn:hover { background: var(--btn-hover); }
    .nav-btn:active { transform: translateY(-50%) scale(0.96); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }
    .nav-btn.prev { left: 0.75rem; }
    .nav-btn.next { right: 0.75rem; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 1.25rem 1rem;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
      z-index: 4;
    }

    .title {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .counter {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      color: var(--fg);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      min-width: 5.5rem;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }

    .hit-zones {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 2;
    }

    .hit-zones .zone {
      flex: 1;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .stage { padding: 0.75rem 3.25rem 0.5rem; }
      .nav-btn { width: 40px; height: 56px; }
      .hint { display: none; }
      .title { font-size: 0.75rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .slide-frame img { transition: opacity 0.12s ease; }
    }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <div class="stage">
      <button class="nav-btn prev" id="prevBtn" aria-label="Previous slide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>

      <div class="slide-frame" id="slideFrame">
        <div class="hit-zones" aria-hidden="true">
          <div class="zone" id="hitPrev"></div>
          <div class="zone" id="hitNext"></div>
        </div>
        <img id="slideImg" alt="Slide 1 of 37" draggable="false" />
      </div>

      <button class="nav-btn next" id="nextBtn" aria-label="Next slide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </button>
    </div>

    <div class="chrome">
      <div class="title">HP SG Report — August 2026</div>
      <div class="counter" id="counter" aria-live="polite">1 / 37</div>
      <div class="hint">← → Space · Home End</div>
    </div>
  </div>

  <script>
    (function () {
      var TOTAL = 37;
      var current = 1;
      var img = document.getElementById("slideImg");
      var counter = document.getElementById("counter");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var cache = {};

      function pad(n) {
        return (n < 10 ? "0" : "") + n;
      }

      function slideUrl(n) {
        return "slides/slide-" + pad(n) + ".jpg";
      }

      function preload(n) {
        if (n < 1 || n > TOTAL || cache[n]) return;
        var i = new Image();
        i.src = slideUrl(n);
        cache[n] = i;
      }

      function show(n) {
        if (n < 1 || n > TOTAL) return;
        current = n;
        img.src = slideUrl(n);
        img.alt = "Slide " + n + " of " + TOTAL;
        counter.textContent = n + " / " + TOTAL;
        prevBtn.disabled = n === 1;
        nextBtn.disabled = n === TOTAL;
        preload(n - 1);
        preload(n + 1);
        preload(n + 2);
        if (history.replaceState) {
          history.replaceState(null, "", "#" + n);
        } else {
          location.hash = n;
        }
      }

      function next() { show(current + 1); }
      function prev() { show(current - 1); }

      prevBtn.addEventListener("click", function (e) { e.stopPropagation(); prev(); });
      nextBtn.addEventListener("click", function (e) { e.stopPropagation(); next(); });
      document.getElementById("hitPrev").addEventListener("click", prev);
      document.getElementById("hitNext").addEventListener("click", next);

      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        switch (e.key) {
          case "ArrowRight":
          case " ":
          case "PageDown":
            e.preventDefault();
            next();
            break;
          case "ArrowLeft":
          case "PageUp":
          case "Backspace":
            e.preventDefault();
            prev();
            break;
          case "Home":
            e.preventDefault();
            show(1);
            break;
          case "End":
            e.preventDefault();
            show(TOTAL);
            break;
        }
      });

      // Touch swipe
      var touchX = null;
      document.addEventListener("touchstart", function (e) {
        if (e.changedTouches && e.changedTouches.length) {
          touchX = e.changedTouches[0].clientX;
        }
      }, { passive: true });

      document.addEventListener("touchend", function (e) {
        if (touchX === null || !e.changedTouches || !e.changedTouches.length) return;
        var dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) < 40) return;
        if (dx < 0) next();
        else prev();
      }, { passive: true });

      // Start from hash if present
      var hash = parseInt((location.hash || "").replace("#", ""), 10);
      show(hash >= 1 && hash <= TOTAL ? hash : 1);
      preload(1);
      preload(2);
      preload(3);
    })();
  </script>
</body>
</html>
